apiVersion: v1
kind: ConfigMap
metadata:
  name: docubrain-config
  namespace: docubrain
data:
  QDRANT_HOST: "qdrant-service"
  QDRANT_PORT: "6333"
  LANGFUSE_BASE_URL: "https://cloud.langfuse.com"
  LANGFUSE_ENVIRONMENT: "kubernetes"
  # Requests arrive through the ingress, so uvicorn has to trust X-Forwarded-For
  # or the per-IP login rate limit would count every user as the ingress pod
  FORWARDED_ALLOW_IPS: "*"

apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend
  namespace: docubrain
  labels:
    app: backend
spec:
  replicas: 2
  selector:
    matchLabels:
      app: backend
  template:
    metadata:
      labels:
        app: backend
    spec:
      containers:
        - name: backend
          image: docubrain-portfolio-backend:k8s
          imagePullPolicy: Never
          ports:
            - containerPort: 8000
          envFrom:
            - configMapRef:
                name: docubrain-config
          env:
            - name: POSTGRES_USER
              valueFrom:
                secretKeyRef:
                  name: docubrain-secrets
                  key: postgres-user
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: docubrain-secrets
                  key: postgres-password
            - name: POSTGRES_DB
              valueFrom:
                secretKeyRef:
                  name: docubrain-secrets
                  key: postgres-db
            - name: REDIS_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: docubrain-secrets
                  key: redis-password
            - name: DATABASE_URL
              value: "postgresql+asyncpg://$(POSTGRES_USER):$(POSTGRES_PASSWORD)@postgres-service:5432/$(POSTGRES_DB)"
            - name: SYNC_DATABASE_URL
              value: "postgresql+psycopg2://$(POSTGRES_USER):$(POSTGRES_PASSWORD)@postgres-service:5432/$(POSTGRES_DB)"
            - name: REDIS_URL
              value: "redis://:$(REDIS_PASSWORD)@redis-service:6379/0"
            - name: SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: docubrain-secrets
                  key: secret-key
            - name: GROQ_API_KEY
              valueFrom:
                secretKeyRef:
                  name: docubrain-secrets
                  key: groq-api-key
            - name: LANGFUSE_PUBLIC_KEY
              valueFrom:
                secretKeyRef:
                  name: docubrain-secrets
                  key: langfuse-public-key
            - name: LANGFUSE_SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: docubrain-secrets
                  key: langfuse-secret-key
          # Loading the models and running migrations takes a while on a cold start.
          # The health endpoints wait up to 2s on a dependency, longer than the default probe timeout.
          startupProbe:
            httpGet:
              path: /api/health
              port: 8000
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 36
          readinessProbe:
            httpGet:
              path: /api/health/ready
              port: 8000
            periodSeconds: 10
            timeoutSeconds: 3
          livenessProbe:
            httpGet:
              path: /api/health
              port: 8000
            periodSeconds: 15
            timeoutSeconds: 3
          resources:
            requests:
              cpu: 250m
              memory: 768Mi
            limits:
              memory: 2Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend
  namespace: docubrain
  labels:
    app: frontend
spec:
  replicas: 2
  selector:
    matchLabels:
      app: frontend
  template:
    metadata:
      labels:
        app: frontend
    spec:
      containers:
        - name: frontend
          image: docubrain-portfolio-frontend:k8s
          imagePullPolicy: Never
          ports:
            - containerPort: 80
          readinessProbe:
            httpGet:
              path: /
              port: 80
            periodSeconds: 10
          resources:
            requests:
              cpu: 10m
              memory: 16Mi
            limits:
              memory: 64Mi
